<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7a1"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7ec8f0"/>
      <stop offset="100%" stop-color="#2471a3"/>
    </radialGradient>
    <radialGradient id="mars" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f08060"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <radialGradient id="jupiter" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0c878"/>
      <stop offset="100%" stop-color="#d4843a"/>
    </radialGradient>
    <radialGradient id="saturn" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8e8a0"/>
      <stop offset="100%" stop-color="#c9a83a"/>
    </radialGradient>
    <radialGradient id="venus" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0ddb0"/>
      <stop offset="100%" stop-color="#d4a84b"/>
    </radialGradient>
    <radialGradient id="mercury" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </radialGradient>
    <radialGradient id="uranus" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a0e8d8"/>
      <stop offset="100%" stop-color="#45b7a0"/>
    </radialGradient>
    <radialGradient id="neptune" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60b8f0"/>
      <stop offset="100%" stop-color="#2471a3"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunFilter">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#0a0a1a"/>

  <!-- Stars -->
  <g fill="white" opacity="0.6">
    <circle cx="50" cy="30" r="1"/><circle cx="120" cy="80" r="0.8"/>
    <circle cx="200" cy="45" r="1.2"/><circle cx="300" cy="20" r="0.7"/>
    <circle cx="380" cy="90" r="1"/><circle cx="450" cy="35" r="0.9"/>
    <circle cx="520" cy="70" r="1.1"/><circle cx="600" cy="25" r="0.8"/>
    <circle cx="700" cy="55" r="1"/><circle cx="780" cy="40" r="0.7"/>
    <circle cx="850" cy="85" r="1.2"/><circle cx="950" cy="30" r="0.9"/>
    <circle cx="1050" cy="60" r="1"/><circle cx="1120" cy="25" r="0.8"/>
    <circle cx="80" cy="150" r="0.9"/><circle cx="160" cy="200" r="1"/>
    <circle cx="250" cy="170" r="0.7"/><circle cx="340" cy="220" r="1.1"/>
    <circle cx="430" cy="160" r="0.8"/><circle cx="550" cy="190" r="1"/>
    <circle cx="650" cy="140" r="0.9"/><circle cx="750" cy="210" r="1.2"/>
    <circle cx="830" cy="170" r="0.7"/><circle cx="920" cy="130" r="1"/>
    <circle cx="1020" cy="180" r="0.8"/><circle cx="1100" cy="150" r="1.1"/>
    <circle cx="70" cy="300" r="1"/><circle cx="150" cy="350" r="0.8"/>
    <circle cx="230" cy="280" r="1.2"/><circle cx="320" cy="400" r="0.7"/>
    <circle cx="410" cy="320" r="1"/><circle cx="500" cy="380" r="0.9"/>
    <circle cx="580" cy="310" r="1.1"/><circle cx="670" cy="360" r="0.8"/>
    <circle cx="760" cy="290" r="1"/><circle cx="840" cy="420" r="0.7"/>
    <circle cx="930" cy="340" r="1.2"/><circle cx="1010" cy="390" r="0.9"/>
    <circle cx="1090" cy="310" r="1"/><circle cx="1150" cy="370" r="0.8"/>
    <circle cx="60" cy="480" r="0.9"/><circle cx="140" cy="520" r="1"/>
    <circle cx="220" cy="460" r="0.7"/><circle cx="310" cy="550" r="1.1"/>
    <circle cx="400" cy="490" r="0.8"/><circle cx="490" cy="530" r="1"/>
    <circle cx="570" cy="470" r="0.9"/><circle cx="660" cy="560" r="1.2"/>
    <circle cx="740" cy="500" r="0.7"/><circle cx="820" cy="540" r="1"/>
    <circle cx="910" cy="480" r="0.8"/><circle cx="1000" cy="550" r="1.1"/>
    <circle cx="1080" cy="510" r="1"/><circle cx="1140" cy="560" r="0.9"/>
    <circle cx="90" cy="620" r="1"/><circle cx="180" cy="650" r="0.8"/>
    <circle cx="270" cy="610" r="1.2"/><circle cx="360" cy="640" r="0.7"/>
    <circle cx="460" cy="620" r="1"/><circle cx="540" cy="650" r="0.9"/>
    <circle cx="630" cy="615" r="1.1"/><circle cx="720" cy="645" r="0.8"/>
    <circle cx="810" cy="620" r="1"/><circle cx="900" cy="650" r="0.7"/>
    <circle cx="980" cy="625" r="1.2"/><circle cx="1060" cy="645" r="0.9"/>
    <circle cx="1130" cy="630" r="1"/><circle cx="1170" cy="650" r="0.8"/>
  </g>

  <!-- Orbit paths -->
  <g fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <circle cx="500" cy="337" r="65"/>
    <circle cx="500" cy="337" r="100"/>
    <circle cx="500" cy="337" r="135"/>
    <circle cx="500" cy="337" r="175"/>
    <circle cx="500" cy="337" r="230"/>
    <circle cx="500" cy="337" r="290"/>
    <circle cx="500" cy="337" r="340"/>
    <circle cx="500" cy="337" r="385"/>
  </g>

  <!-- Sun -->
  <circle cx="500" cy="337" r="40" fill="url(#sunGlow)" filter="url(#sunFilter)" opacity="0.4"/>
  <circle cx="500" cy="337" r="22" fill="url(#sunCore)" filter="url(#glow)"/>

  <!-- Mercury -->
  <circle cx="565" cy="337" r="4" fill="url(#mercury)" filter="url(#glow)"/>

  <!-- Venus -->
  <circle cx="430" cy="250" r="6" fill="url(#venus)" filter="url(#glow)"/>

  <!-- Earth + Moon -->
  <circle cx="590" cy="460" r="7" fill="url(#earth)" filter="url(#glow)"/>
  <circle cx="602" cy="454" r="2" fill="#d4d4d4"/>

  <!-- Mars + moons -->
  <circle cx="340" cy="200" r="5" fill="url(#mars)" filter="url(#glow)"/>
  <circle cx="330" cy="195" r="1.5" fill="#a89080"/>
  <circle cx="350" cy="208" r="1" fill="#b0a090"/>

  <!-- Jupiter + moons -->
  <circle cx="720" cy="280" r="14" fill="url(#jupiter)" filter="url(#glow)"/>
  <circle cx="740" cy="270" r="2" fill="#f5e642"/>
  <circle cx="700" cy="268" r="1.8" fill="#c8dce8"/>
  <circle cx="735" cy="298" r="2.5" fill="#b8a888"/>
  <circle cx="698" cy="290" r="2" fill="#8a7a6a"/>

  <!-- Saturn + rings + moons -->
  <ellipse cx="260" cy="430" rx="22" ry="5" fill="none" stroke="#f0d58c" stroke-width="1.5" opacity="0.6" transform="rotate(-20, 260, 430)"/>
  <circle cx="260" cy="430" r="12" fill="url(#saturn)" filter="url(#glow)"/>
  <circle cx="240" cy="418" r="2.5" fill="#e8c870"/>
  <circle cx="280" cy="440" r="1.5" fill="#c0c0c0"/>
  <circle cx="250" cy="448" r="1.2" fill="#f0f0ff"/>

  <!-- Uranus + moons -->
  <circle cx="170" cy="180" r="9" fill="url(#uranus)" filter="url(#glow)"/>
  <circle cx="155" cy="172" r="1.8" fill="#c8c8c8"/>
  <circle cx="185" cy="188" r="1.8" fill="#b0b0b0"/>
  <circle cx="162" cy="192" r="1.2" fill="#d0d0d0"/>

  <!-- Neptune + moons -->
  <circle cx="850" cy="450" r="8" fill="url(#neptune)" filter="url(#glow)"/>
  <circle cx="865" cy="442" r="2" fill="#a8c8d8"/>
  <circle cx="838" cy="460" r="1.2" fill="#909090"/>

  <!-- Info Panel -->
  <rect x="920" y="80" rx="12" ry="12" width="250" height="260" fill="rgba(15,23,42,0.92)" stroke="rgba(100,116,139,0.4)" stroke-width="1"/>
  <text x="945" y="115" fill="white" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Земля</text>
  <text x="945" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Earth</text>
  <circle cx="1130" cy="115" r="16" fill="url(#earth)"/>

  <text x="945" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Наш дом — единственная планета</text>
  <text x="945" y="182" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">с известной жизнью.</text>

  <line x1="940" y1="200" x2="1150" y2="200" stroke="rgba(100,116,139,0.3)" stroke-width="1"/>
  <text x="945" y="222" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">📏 Диаметр</text>
  <text x="1100" y="222" fill="white" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">12 756 км</text>

  <line x1="940" y1="235" x2="1150" y2="235" stroke="rgba(100,116,139,0.2)" stroke-width="1"/>
  <text x="945" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">☀️ Расстояние</text>
  <text x="1100" y="255" fill="white" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">149.6 млн км</text>

  <line x1="940" y1="268" x2="1150" y2="268" stroke="rgba(100,116,139,0.2)" stroke-width="1"/>
  <text x="945" y="288" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">🔄 Орбит. период</text>
  <text x="1100" y="288" fill="white" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">365.25 дней</text>

  <line x1="940" y1="301" x2="1150" y2="301" stroke="rgba(100,116,139,0.2)" stroke-width="1"/>
  <text x="945" y="321" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">🌙 Спутники</text>
  <text x="1100" y="321" fill="white" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Луна</text>

  <!-- Controls bar -->
  <rect x="150" y="590" rx="12" ry="12" width="700" height="65" fill="rgba(15,23,42,0.85)" stroke="rgba(100,116,139,0.4)" stroke-width="1"/>

  <!-- Play button -->
  <rect x="175" y="605" rx="8" ry="8" width="90" height="35" fill="#4f46e5"/>
  <rect x="198" y="616" width="4" height="14" fill="white" rx="1"/>
  <rect x="207" y="616" width="4" height="14" fill="white" rx="1"/>
  <text x="218" y="627" fill="white" font-family="system-ui, sans-serif" font-size="11">Пауза</text>

  <!-- Zoom button -->
  <rect x="280" y="605" rx="8" ry="8" width="110" height="35" fill="#059669"/>
  <text x="305" y="627" fill="white" font-family="system-ui, sans-serif" font-size="11">🔍 Приблизить</text>

  <!-- Moons toggle -->
  <rect x="405" y="605" rx="8" ry="8" width="120" height="35" fill="#7c3aed"/>
  <text x="425" y="627" fill="white" font-family="system-ui, sans-serif" font-size="11">🌙 Спутники: ВКЛ</text>

  <!-- Speed controls -->
  <text x="545" y="618" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Скорость:</text>
  <rect x="545" y="624" rx="4" ry="4" width="30" height="18" fill="#4f46e5"/>
  <text x="553" y="637" fill="white" font-family="system-ui, sans-serif" font-size="9">0.01×</text>
  <rect x="580" y="624" rx="4" ry="4" width="28" height="18" fill="#374151"/>
  <text x="586" y="637" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">0.25×</text>
  <rect x="613" y="624" rx="4" ry="4" width="24" height="18" fill="#374151"/>
  <text x="621" y="637" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">0.5×</text>
  <rect x="642" y="624" rx="4" ry="4" width="20" height="18" fill="#374151"/>
  <text x="649" y="637" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">1×</text>
  <rect x="667" y="624" rx="4" ry="4" width="20" height="18" fill="#374151"/>
  <text x="674" y="637" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">2×</text>
  <rect x="692" y="624" rx="4" ry="4" width="20" height="18" fill="#374151"/>
  <text x="699" y="637" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">5×</text>
  <rect x="717" y="624" rx="4" ry="4" width="24" height="18" fill="#374151"/>
  <text x="722" y="637" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">10×</text>

  <!-- Planet quick-select pills -->
  <g font-family="system-ui, sans-serif" font-size="9">
    <rect x="220" y="560" rx="10" ry="10" width="55" height="20" fill="rgba(55,65,81,0.5)"/>
    <circle cx="233" cy="570" r="4" fill="url(#mercury)"/><text x="241" y="574" fill="#9ca3af">Меркурий</text>

    <rect x="282" y="560" rx="10" ry="10" width="48" height="20" fill="rgba(55,65,81,0.5)"/>
    <circle cx="295" cy="570" r="4" fill="url(#venus)"/><text x="303" y="574" fill="#9ca3af">Венера</text>

    <rect x="337" y="560" rx="10" ry="10" width="42" height="20" fill="rgba(75,85,99,0.8)" stroke="rgba(107,114,128,0.5)" stroke-width="0.5"/>
    <circle cx="350" cy="570" r="4" fill="url(#earth)"/><text x="358" y="574" fill="white">Земля</text>

    <rect x="386" y="560" rx="10" ry="10" width="40" height="20" fill="rgba(55,65,81,0.5)"/>
    <circle cx="399" cy="570" r="4" fill="url(#mars)"/><text x="407" y="574" fill="#9ca3af">Марс</text>

    <rect x="433" y="560" rx="10" ry="10" width="50" height="20" fill="rgba(55,65,81,0.5)"/>
    <circle cx="446" cy="570" r="4" fill="url(#jupiter)"/><text x="454" y="574" fill="#9ca3af">Юпитер</text>

    <rect x="490" y="560" rx="10" ry="10" width="50" height="20" fill="rgba(55,65,81,0.5)"/>
    <circle cx="503" cy="570" r="4" fill="url(#saturn)"/><text x="511" y="574" fill="#9ca3af">Сатурн</text>

    <rect x="547" y="560" rx="10" ry="10" width="42" height="20" fill="rgba(55,65,81,0.5)"/>
    <circle cx="560" cy="570" r="4" fill="url(#uranus)"/><text x="568" y="574" fill="#9ca3af">Уран</text>

    <rect x="596" y="560" rx="10" ry="10" width="52" height="20" fill="rgba(55,65,81,0.5)"/>
    <circle cx="609" cy="570" r="4" fill="url(#neptune)"/><text x="617" y="574" fill="#9ca3af">Нептун</text>
  </g>

  <!-- Title -->
  <text x="500" y="35" fill="white" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">🌌 Интерактивная Солнечная система</text>
  <text x="500" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Нажмите на планету для получения информации</text>
</svg>
